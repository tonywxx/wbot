# ---------------- 20 个经典高胜率策略（日线 DSL） ----------------

[[rules]]
id = "s01_ma_bull_arr"
label = "均线多头排列"
side = "buy"
scope = "watchlist"
enabled = true
signal = "and(gt(MA(close,5), MA(close,10)), gt(MA(close,10), MA(close,20)))"
note = "MA5>MA10>MA20 三线多头排列，中期强势趋势，顺势持有。"

[[rules]]
id = "s02_ma_bear_arr"
label = "均线空头排列"
side = "sell"
scope = "watchlist"
enabled = true
signal = "and(lt(MA(close,5), MA(close,10)), lt(MA(close,10), MA(close,20)))"
note = "MA5<MA10<MA20 三线空头排列，中期弱势，离场或回避。"

[[rules]]
id = "s03_ema_gold"
label = "EMA5 上穿 EMA10"
side = "buy"
scope = "watchlist"
enabled = true
signal = "cross_above(EMA(close,5), EMA(close,10))"
note = "指数均线金叉，对近期价格更敏感，适合短线。"

[[rules]]
id = "s04_ema_dead"
label = "EMA5 下穿 EMA10"
side = "sell"
scope = "watchlist"
enabled = true
signal = "cross_below(EMA(close,5), EMA(close,10))"
note = "指数均线死叉，短线离场信号。"

[[rules]]
id = "s05_rsi_rebound"
label = "RSI 脱离超卖"
side = "buy"
scope = "watchlist"
enabled = true
signal = "cross_above(RSI(close,14), 30)"
note = "RSI 从超卖区上穿 30，超卖反弹启动。"

[[rules]]
id = "s06_rsi_fallback"
label = "RSI 脱离超买"
side = "sell"
scope = "watchlist"
enabled = true
signal = "cross_below(RSI(close,14), 70)"
note = "RSI 从超买区下穿 70，短线见顶回落。"

[[rules]]
id = "s07_rsi_ext_oversold"
label = "RSI 极度超卖 (<20)"
side = "buy"
scope = "watchlist"
enabled = true
signal = "lt(RSI(close,14), 20)"
note = "RSI<20 极度超卖，博弈技术反弹（需结合量能）。"

[[rules]]
id = "s08_rsi_ext_overbought"
label = "RSI 极度超买 (>80)"
side = "sell"
scope = "watchlist"
enabled = true
signal = "gt(RSI(close,14), 80)"
note = "RSI>80 极度超买，获利了结信号。"

[[rules]]
id = "s09_macd_hist_up"
label = "MACD 红柱初现"
side = "buy"
scope = "watchlist"
enabled = true
signal = "cross_above(MACD(close,12,26,9).hist, 0)"
note = "MACD 柱状由负转正，下跌动能衰竭、反弹开始。"

[[rules]]
id = "s10_macd_hist_down"
label = "MACD 绿柱初现"
side = "sell"
scope = "watchlist"
enabled = true
signal = "cross_below(MACD(close,12,26,9).hist, 0)"
note = "MACD 柱状由正转负，上涨动能衰竭、回调开始。"

[[rules]]
id = "s11_macd_dif_dea_gold"
label = "MACD 快慢线金叉"
side = "buy"
scope = "watchlist"
enabled = true
signal = "cross_above(MACD(close,12,26,9).dif, MACD(close,12,26,9).dea)"
note = "MACD  dif 上穿 dea（零轴上方更可靠），趋势性买点。"

[[rules]]
id = "s12_macd_dif_dea_dead"
label = "MACD 快慢线死叉"
side = "sell"
scope = "watchlist"
enabled = true
signal = "cross_below(MACD(close,12,26,9).dif, MACD(close,12,26,9).dea)"
note = "MACD dif 下穿 dea，趋势性卖点。"

[[rules]]
id = "s13_kdj_gold"
label = "KDJ 金叉"
side = "buy"
scope = "watchlist"
enabled = true
signal = "cross_above(KDJ(close,9,3,3).k, KDJ(close,9,3,3).d)"
note = "KDJ 的 K 上穿 D，短线转强；低位金叉更优。"

[[rules]]
id = "s14_kdj_dead"
label = "KDJ 死叉"
side = "sell"
scope = "watchlist"
enabled = true
signal = "cross_below(KDJ(close,9,3,3).k, KDJ(close,9,3,3).d)"
note = "KDJ 的 K 下穿 D，短线转弱；高位死叉更优。"

[[rules]]
id = "s15_kdj_overbought"
label = "KDJ 严重超买 (J>100)"
side = "sell"
scope = "watchlist"
enabled = true
signal = "gt(KDJ(close,9,3,3).j, 100)"
note = "J 值>100 严重超买，追高风险大，注意回落。"

[[rules]]
id = "s16_boll_lower_rebound"
label = "布林下轨反弹"
side = "buy"
scope = "watchlist"
enabled = true
signal = "cross_above(PRICE(close), BOLL(close,20,2).lower)"
note = "收盘价从布林下轨下方回到轨内，超跌反弹。"

[[rules]]
id = "s17_boll_upper_fallback"
label = "布林上轨回落"
side = "sell"
scope = "watchlist"
enabled = true
signal = "cross_below(PRICE(close), BOLL(close,20,2).upper)"
note = "收盘价从布林上轨上方回到轨内，短线见顶。"

[[rules]]
id = "s18_boll_breakout"
label = "布林向上突破"
side = "buy"
scope = "watchlist"
enabled = true
signal = "cross_above(PRICE(close), BOLL(close,20,2).upper)"
note = "收盘价突破布林上轨，放量时视为趋势加速。"

[[rules]]
id = "s19_vol_price_up"
label = "量价齐升"
side = "buy"
scope = "watchlist"
enabled = true
signal = "and(gt(PRICE(close), MA(close,5)), gt(PRICE(volume), MA(volume,5)))"
note = "价在 5 日均线之上且量能放大，量价配合的健康上涨。"

[[rules]]
id = "s20_ema_trend"
label = "中线趋势跟踪"
side = "buy"
scope = "watchlist"
enabled = true
signal = "and(gt(EMA(close,20), EMA(close,60)), gt(PRICE(close), EMA(close,20)))"
note = "EMA20>EMA60 且价在 EMA20 之上，经典中线多头趋势。"

