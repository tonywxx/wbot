# 模拟交易策略（用户可自由编辑）
#
# scope   : "watchlist" 或逗号分隔的代码列表，如 "600519,000858"
# side    : "buy" / "sell"
# signal  : 条件表达式（函数式 DSL）
#   逻辑   : and(...) or(...) not(...)
#   比较   : gt(a,b) lt(a,b) gte(a,b) lte(a,b) eq(a,b)
#   交叉   : cross_above(a,b) cross_below(a,b)
#   指标   : MA(src,p) SMA(src,p) EMA(src,p) RSI(src,p)
#            MACD(src,fast,slow,sig).dif/.dea/.hist
#            KDJ(n,k,d).k/.d/.j   BOLL(p,k).mid/.upper/.lower
#   价格   : PRICE(close)
#   来源   : close | open | high | low | volume
#
# 形态规则（顺序状态机，非点状 DSL）：
#   kind = "pattern"          固定值，声明这是形态规则（不使用 signal 字段）
#   pattern = "double_golden" 形态名（双金叉/双死叉回踩）
#   timeframe = "15"          分钟周期：1/5/15/30/60（变量可改）
#   fast / slow = 5 / 10      EMA 快/慢线周期
#   bars = 100               回看根数（Sina 1H 仅约 36 根，会自动按可用数据截断）
#   higher_low = true        回踩不破前低 / 反抽不过前高
#   买入：两次金叉之间出现死叉回踩且不破前低、末根成本高于慢线 -> 多头成本基础
#   卖出：两次死叉之间出现金叉反抽且不过前高、末根成本低于慢线 -> 空头成本基础
#
# note    : 任意规则均可带 note 字段，作为策略备注/说明，在选择界面展示。
# 带 timeframe 的 DSL 规则（如 T+0）会改用对应分钟 K 线求值（非日线）。
#
# 胜率说明：每条规则「胜率」由回测引擎在所选个股上实测（信号触发后持有 N 根的前向收益），
#           并非主观断言；选择界面会实时展示回测胜率。

# ---------------- 基础示例（日线 DSL） ----------------

[[rules]]
id = "ma_golden"
label = "MA5 上穿 MA10 (金叉)"
side = "buy"
scope = "watchlist"
enabled = true
signal = "cross_above(MA(close,5), MA(close,10))"
note = "短期均线金叉，经典趋势启动信号；用于日线。"

[[rules]]
id = "ma_dead"
label = "MA5 下穿 MA10 (死叉)"
side = "sell"
scope = "watchlist"
enabled = true
signal = "cross_below(MA(close,5), MA(close,10))"
note = "短期均线死叉，趋势转弱信号；用于日线。"

[[rules]]
id = "rsi_oversold"
label = "RSI14 超卖 (<30)"
side = "buy"
scope = "watchlist"
enabled = true
signal = "lt(RSI(close,14), 30)"
note = "RSI 进入超卖区，反弹概率较高；用于日线。"

[[rules]]
id = "rsi_overbought"
label = "RSI14 超买 (>70)"
side = "sell"
scope = "watchlist"
enabled = true
signal = "gt(RSI(close,14), 70)"
note = "RSI 进入超买区，回调概率较高；用于日线。"

[[rules]]
id = "macd_golden"
label = "MACD 金叉 (dif 上穿 dea)"
side = "buy"
scope = "watchlist"
enabled = true
signal = "cross_above(MACD(close,12,26,9).dif, MACD(close,12,26,9).dea)"
note = "MACD 快慢线金叉，动能转多；用于日线。"

