[package]
name = "wbot"
version = "0.1.0"
edition = "2024"

[dependencies]
# akshare-rs — published on crates.io as `akshare`; repo is github.com/Cricle/akshare-rs.
# Only enable the `equity` feature (A-share + index) to keep the dependency tree lean.
akshare = { version = "0.1", default-features = false, features = ["equity"] }
# adaq-talib — pure-Rust, zero-FFI, no-dependency reimplementation of TA-Lib 0.7.1.
# Replaces the previous C TA-Lib FFI binding: all TA_* indicators now call adaq-talib.
adaq-talib = "0.1.1"
# yfinance-rs — ergonomic async Yahoo Finance client (US stocks). Pulls in `paft`
# (which brings `polars`); compiled with rustls, no system OpenSSL needed.
# `history()` returns `Vec<Candle>` (paft OHLCV bars); see src/market.rs for mapping.
yfinance-rs = "0.9"
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"
# Relaxed from `=1.44.2`: yfinance-rs requires tokio ^1.48.
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1.0.104"
# Provides `ToPrimitive` so yfinance-rs's `Decimal` can be converted to `f64`.
num-traits = "0.2"

# 模拟交易系统新增依赖
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4.20", features = ["serde"] }

# okx-rs — unofficial OKX V5 API client (crypto market data + trading).
# Provides the `Rest` transport used both for public candle fetches and
# authenticated order placement. Pulls in reqwest (native-tls).
okx-rs = { git = "https://github.com/roytang121/okx-rs" }
# Direct reqwest dep so we can reference `reqwest::Method` when defining
# custom request structs against okx-rs's `Request` trait. Unifies to the
# same 0.11.x version pulled by okx-rs.
reqwest = "0.11"
