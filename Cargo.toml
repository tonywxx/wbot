[package]
edition = "2024"
name = "wbot"
version = "0.1.3"

[dependencies]
# akshare-rs — published on crates.io as `akshare`; repo is github.com/Cricle/akshare-rs.
# Only enable the `equity` feature (A-share + index) to keep the dependency tree lean.
akshare = {version = "0.1", default-features = false, features = ["equity"]}
# adaq-talib — pure-Rust, zero-FFI, no-dependency reimplementation of TA-Lib 0.7.1.
adaq-talib = "0.1.5"
# yfinance-rs — ergonomic async Yahoo Finance client (US stocks). Pulls in `paft`
# (which brings `polars`); compiled with rustls, no system OpenSSL needed.
# `history()` returns `Vec<Candle>` (paft OHLCV bars); see src/market.rs for mapping.
crossterm = "0.29"
ratatui = {version = "0.30", features = ["crossterm"]}
yfinance-rs = "0.9"
# Relaxed from `=1.44.2`: yfinance-rs requires tokio ^1.48.
anyhow = "1.0.104"
tokio = {version = "1.53", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
]}
# Provides `ToPrimitive` so yfinance-rs's `Decimal` can be converted to `f64`.
num-traits = "0.2"

# 模拟交易系统新增依赖
chrono = {version = "0.4.45", features = ["serde"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
toml = "1.1.4"

# adaq-trading-crypto — ccxt 兼容的加密货币统一接口（历史 K 线 / WebSocket 实时行情 /
# 实盘下单）。OKX 适配器经 `okx` feature 编译；`realtime` feature 开启 WebSocket 实时。
# default-features=false 仅启用 okx + realtime，避免引入预测市场等无关适配器依赖。
adaq-trading-crypto = {version = "1.0.5", default-features = false, features = [
  "okx",
  "realtime",
]}
# OHLCV / Ticker 的 `rust_decimal::Decimal` 转换为 f64（版本需与 adaq 内部 Decimal 对齐）。
rust_decimal = "1"
# adaq 的 WebSocket 走 rustls TLS，需显式启用一个 crypto provider（否则运行时报
# "Could not automatically determine the process-level CryptoProvider"）。启用 `ring`
# 让 rustls 安装默认 provider（feature 统一作用于 adaq 传递依赖的 rustls）。
rustls = {version = "0.23", features = ["ring"]}
# reqwest 仍用于 A 股（东方财富）/ 美股（Yahoo）实时报价源（加密货币已改走 adaq）。
reqwest = "0.13.4"
