# wbot 全局配置
#
# 所有字段均为可选；缺失字段自动回退到内置默认值（见 src/config.rs），
# 文件缺失或解析失败也不会 panic，仅使用默认配置。

# ─────────────────────────────────────────────────────────────
# 界面语言（i18n）
#
# 默认英文显示。如需切换为简体中文，将下行取消注释并改为：
#   language = "zh-CN"
# 支持的取值（不区分大小写）：en / zh / zh-CN / chinese / 中文 等。
# ─────────────────────────────────────────────────────────────
language = "en"

# ─────────────────────────────────────────────────────────────
# 加密货币（OKX）支持
# ─────────────────────────────────────────────────────────────
# 是否启用加密货币数据源与交易支持（默认 true）。
crypto_enabled = true
# 是否启用 OKX 真实下单（默认 false）。
# 仅在 true 且已配置环境变量 OKX_API_KEY / OKX_API_SECRET / OKX_PASSPHRASE 时，
# TUI 中回车下单才会真实发往 OKX；否则只更新本地模拟账户（CryptoLedger）。
live_trading = false
# 单次买入预算（以 USDT 计价），用于把预算换算为基础币数量（默认 1000.0）。
crypto_lot_usdt = 1000.0
# 加密货币单边手续费率（默认 0.001，即 0.1%）。
crypto_fee_rate = 0.001

# ─────────────────────────────────────────────────────────────
# 涨跌配色（up = 涨，down = 跌）
# 默认 涨=绿（green）、跌=红（red）。支持命名色（red/green/yellow/blue/
# cyan/magenta/white/gray/darkgray 及 light* 变体）或 #rrggbb，非法值回退默认。
# ─────────────────────────────────────────────────────────────
up_color = "green"
down_color = "red"

# ─────────────────────────────────────────────────────────────
# 行情 / 手续费 / K 线
# ─────────────────────────────────────────────────────────────
default_scope = "watchlist"
# 双边手续费率（A 股，默认 0.0003）。
commission = 0.0003
# 印花税率（仅卖出，A 股，默认 0.0005）。
stamp_tax = 0.0005
# 每手股数（A 股，默认 100）。
lot_size = 100
# 自动下单开关（默认 false，仅手动）。
auto_trade = false
# K 线复权方式（qfq 前复权；加密货币现货忽略此选项）。
kline_adjust = "qfq"
# K 线保留根数（默认 250）。
kline_count = 250
# 分钟 K 线刷新间隔（秒，默认 120）。
intraday_refresh = 120

# ─────────────────────────────────────────────────────────────
# 桌面通知
# ─────────────────────────────────────────────────────────────
notify_enabled = true
# 同一 (标的, 规则) 通知冷却时间（秒，默认 300）。
notify_cooldown = 300
